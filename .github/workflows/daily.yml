name: Daily US Sector Update

on:
  schedule:
    - cron: '30 21 * * 1-5'  # 逢美股交易日收盤後自動跑
  workflow_dispatch:          # 支援手動隨時觸發

permissions:
  contents: write

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas numpy plotly yfinance

      - name: Run Sector Analysis
        run: |
          python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Auto update daily sector report" || echo "No changes"
          git push
